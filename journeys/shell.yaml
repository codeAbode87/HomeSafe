  - {id: settings.open_fold_figures, from: settings, to: settings_fold_figures, pending: "not yet verified on a device", do: [{scroll_to: {text: Exercise figures}}, {tap: {text: Exercise figures}}]}
  - {id: settings_fold_figures.close, from: settings_fold_figures, to: settings, pending: "not yet verified on a device", do: [{tap: {text: Exercise figures}}]}
  - {id: settings.open_fold_maps, from: settings, to: settings_fold_maps, pending: "not yet verified on a device", do: [{scroll_to: {id: settings_maps}}, {tap: {id: settings_maps}}]}
  - {id: settings_fold_maps.close, from: settings_fold_maps, to: settings, pending: "not yet verified on a device", do: [{tap: {id: settings_maps}}]}
  - {id: settings.open_fold_app_icon, from: settings, to: settings_fold_app_icon, pending: "not yet verified on a device", do: [{scroll_to: {text: App icon}}, {tap: {text: App icon}}]}
  - {id: settings_fold_app_icon.close, from: settings_fold_app_icon, to: settings, pending: "not yet verified on a device", do: [{tap: {text: App icon}}]}

