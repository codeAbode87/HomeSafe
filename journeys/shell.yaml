  - {id: car_tagging.back, from: car_tagging, to: camera_detail, pending: "not yet verified on a device", do: [back]}
  - {id: camera_detail.open_tag_car, from: camera_detail, to: tag_car_dialog, pending: "not yet verified on a device", do: [{tap: {text_matches: "Tag (this )?car"}}]}
  - {id: tag_car_dialog.close_to_camera, from: tag_car_dialog, to: camera_detail, pending: "not yet verified on a device", do: [back]}

  # ---- Moments ----
  - {id: moments.open_tag_car, from: moments, to: tag_car_dialog, pending: "not yet verified on a device", do: [{tap: {text: "Tag this car"}}]}
  - {id: tag_car_dialog.close_to_moments, from: tag_car_dialog, to: moments, pending: "not yet verified on a device", do: [back]}
  - {id: moments.open_full_screen, from: moments, to: camera_detail, pending: "not yet verified on a device", do: [{tap: {desc: "Play full screen"}}]}
  - {id: moments.open_day_picker, from: moments, to: moments_day_picker, pending: "not yet verified on a device", do: [{tap: {text: "Pick a day"}}]}
  - {id: moments_day_picker.pick, from: moments_day_picker, to: moments, pending: "not yet verified on a device", do: [{tap: {text: Show}}]}
  - {id: moments_day_picker.cancel, from: moments_day_picker, to: moments, pending: "not yet verified on a device", do: [{tap: {text: Cancel}}]}

  # ---- From outside the app: notifications and links ----
