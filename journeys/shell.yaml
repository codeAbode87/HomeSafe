  - {id: sign_in_biometric_offer.not_now, from: sign_in_biometric_offer, to: home, pending: "needs a device capability", do: [{tap: {text: "Not now"}}]}
  - {id: sign_in.open_apps, from: sign_in, to: sign_in_drawer, pending: "not yet verified on a device", do: [{tap: {id: sign_in_apps}}]}
  - {id: sign_in_drawer.close, from: sign_in_drawer, to: sign_in, pending: "not yet verified on a device", do: [back]}
  - {id: sign_in_drawer.open_fitness, from: sign_in_drawer, to: fitness_today, pending: "not yet verified on a device", do: [{tap: {id: drawer_fitness}}]}
  - {id: sign_in_drawer.open_weather, from: sign_in_drawer, to: weather_welcome, pending: "not yet verified on a device", do: [{tap: {id: drawer_weather}}]}
  - {id: sign_in_drawer.open_finance, from: sign_in_drawer, to: finance_unavailable, pending: "not yet verified on a device", do: [{tap: {id: drawer_finance}}]}
  - {id: sign_in_drawer.open_atlas, from: sign_in_drawer, to: atlas_offline, pending: "not yet verified on a device", do: [{tap: {id: drawer_atlas}}]}

