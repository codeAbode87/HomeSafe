  - {id: camera_detail.back, from: camera_detail, to: home, do: [back]}
  - {id: server.open_uptime, from: server, to: uptime, do: [{tap: {text: Uptime}}]}
  - {id: uptime.back, from: uptime, to: server, do: [back]}
  - {id: shell.open_drawer, from: home, to: drawer, do: [{tap: {id: shell_menu}}]}
  - {id: drawer.close, from: drawer, to: home, do: [back]}
  - {id: shell.open_badge_menu, from: home, to: arrange_menu, do: [{tap: {text: Tailscale}}]}
  - {id: arrange_menu.close, from: arrange_menu, to: home, do: [back]}
  - {id: moments.open_camera_filter, from: moments, to: camera_filter, do: [{tap: {text: All cameras}}]}
  - {id: moments.open_event_filter, from: moments, to: event_filter, do: [{tap: {text: All events}}]}
  - {id: camera_filter.close, from: camera_filter, to: moments, do: [back]}
  - {id: event_filter.close, from: event_filter, to: moments, do: [back]}
  - {id: drawer.open_fitness, from: drawer, to: fitness_today, do: [{tap: {id: drawer_fitness}}]}
  - {id: drawer.open_weather, from: drawer, to: weather_welcome, do: [{tap: {id: drawer_weather}}]}
  - {id: drawer.open_finance_off, from: drawer, to: finance_unavailable, when: "relay == 'off'", do: [{tap: {id: drawer_finance}}]}
  - {id: drawer.open_finance_on, from: drawer, to: finance_outdated, when: "relay == 'on'", do: [{tap: {id: drawer_finance}}]}
  - {id: drawer.open_atlas_off, from: drawer, to: atlas_offline, when: "relay == 'off'", do: [{tap: {id: drawer_atlas}}]}
  - {id: drawer.open_atlas_on, from: drawer, to: atlas_map, when: "relay == 'on'", do: [{tap: {id: drawer_atlas}}]}
  - {id: drawer.open_packages_off, from: drawer, to: packages_unreachable, when: "relay == 'off'", do: [{tap: {id: drawer_packages}}]}
  - {id: drawer.open_packages_on, from: drawer, to: packages_today, when: "relay == 'on'", do: [{tap: {id: drawer_packages}}]}
  - {id: drawer.open_charging_off, from: drawer, to: charging_unreachable, when: "relay == 'off'", do: [{tap: {id: drawer_charging}}]}
  - {id: drawer.open_charging_on, from: drawer, to: charging_home, when: "relay == 'on'", do: [{tap: {id: drawer_charging}}]}

  # ---- Sign-in ----
  - {id: sign_in.connect, from: sign_in, to: home, pending: "not yet verified on a device", do: [{tap: {id: sign_in_connect}}, {wait: {present: {id: bottom_nav_home}, timeout_ms: 30000}}]}
  - {id: sign_in.connect_refused, from: sign_in, to: "=", pending: "not yet verified on a device", do: [{tap: {id: sign_in_connect}}]}
  - {id: sign_in.offer_biometrics, from: sign_in, to: sign_in_biometric_offer, pending: "needs a device capability", do: [{tap: {id: sign_in_connect}}]}
