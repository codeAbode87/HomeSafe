  - {id: camera_overflow_menu.open_tag_cars, from: camera_overflow_menu, to: car_tagging, pending: "not yet verified on a device", do: [{tap: {text: "Tag cars in view"}}]}
  - {id: camera_detail.open_quality_menu, from: camera_detail, to: camera_quality_menu, pending: "not yet verified on a device", do: [{tap: {desc_contains: "Video quality:"}}]}
  - {id: camera_quality_menu.close, from: camera_quality_menu, to: camera_detail, pending: "not yet verified on a device", do: [back]}
  - {id: camera_detail.open_clip_editor, from: camera_detail, to: clip_editor, pending: "not yet verified on a device", do: [{tap: {desc_contains: "Clip a video from"}}]}
