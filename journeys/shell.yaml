nodes:
  # ---- Tabs (verified on a device) ----
  home:
    # A phone on its side lays this screen out differently (the `window: landscape` scenarios, still pending),
    # so "the same screen after a rotation" is not the right check here yet.
    resilience: {skip: [rotate]}
    title: Home
    match:
      all: [{id: home_feed}]
    covers: ["tab:TopLevelRoute.Home", "page:route.AppShellRoute", "page:route.CameraListRoute", "state:ConnectionProblem.TailscaleOff", "state:ConnectionProblem.ServerUnreachable", "deeplink:ShellCommand.Go"]
    params:
      layout:
        pill: {}
        rail: {observe: {id: nav_rail}}
        sidebar: {observe: {id: shell_sidebar}}
      feed:
        content: {when: "data == 'household' or data == 'quiet'", observe: {text: "Back Yard"}}
        loading: {}
        empty: {observe: {text: "No cameras found on this server."}}
        all_hidden: {observe: {text_contains: "Every camera here is hidden"}}
      connection:
        ok: {}
        tailscale_off: {observe: {text: "Tailscale isn't connected on this device"}}
        unreachable: {observe: {text: "Can't reach the server"}}
      presence:
        someone_home: {}
        everyone_away: {observe: {text: "Away mode · nobody home · alerts escalated"}}
    checks:
      - present: {id: shell_menu}
      - present: {id: bottom_nav_home}
    weight: 5
    sources: ["shared/src/commonMain/kotlin/**/HomeLiveViewScreen.kt", "shared/src/commonMain/kotlin/**/HomeGlance.kt"]
  moments:
    # A phone on its side lays this screen out differently (the `window: landscape` scenarios, still pending),
    # so "the same screen after a rotation" is not the right check here yet.
    resilience: {skip: [rotate]}
    title: Moments
    match:
      all: [{text: "All events"}, {id: bottom_nav_moments}]
    covers: ["tab:TopLevelRoute.Moments"]
    params:
      feed:
        content: {when: "data == 'household'", observe: {text: "That's everything the server still has."}}
        empty: {when: "data == 'quiet'", observe: {text_contains: "Nothing to show yet"}}
        error: {observe: {text: "Couldn't reach the server for detections."}}
    checks:
      - present: {text: "All cameras"}
      - present: {id: shell_menu}
    weight: 3
    sources: ["features/moments/src/commonMain/**/*.kt"]
  settings:
    title: Settings
    match:
      all: [{id: settings_maps}]
    covers: ["tab:TopLevelRoute.Settings", "page:route.SettingsHomeRoute"]
    params:
      server_summary:
        healthy: {observe: {text_contains: "healthy"}}
        unreachable: {observe: {text_contains: "can't reach the server"}}
        checking: {observe: {text_contains: "checking…"}}
    # The Household Cars row is hidden under data=quiet (no classifier yet), but nothing on screen marks its absence, so it is no parameter.
    checks:
      - present: {id: settings_finance_drawer}
      - present: {id: shell_menu}
    weight: 3
    sources: ["shared/src/commonMain/kotlin/**/SettingsScreen.kt", "shared/src/commonMain/kotlin/**/SettingsTabNav.kt"]
  # ---- Settings pages (verified on a device) ----
  notifications:
    title: Notifications
    group: shell
    match:
      all: [{text: "What every app tells this phone"}]
    covers: ["screen:NotificationsSettingsScreen", "page:route.NotificationsRoute"]
    params:
      finance_alerts:
        none: {}
        loading: {observe: {text: "Reading the budget's alerts…"}}
        failed: {}
        ready: {observe: {text: "The month's limit"}}
      permission:
        granted: {}
        blocked: {observe: {text: "Blocked in system settings. Allow notifications for HomeSafe to turn this on."}}
    sources: ["shared/src/commonMain/kotlin/**/NotificationsSettingsScreen.kt", "shared/src/commonMain/kotlin/**/AlertRulesSection.kt"]
  away:
    title: Away mode
    group: shell
    match:
      all: [{text: "Who's home, by the two phones"}]
    covers: ["screen:AwaySettingsScreen", "page:route.AwayRoute", "state:LocationAccess.ALWAYS", "state:LocationAccess.WHILE_IN_USE", "state:LocationAccess.DENIED", "state:LocationAccess.NOT_ASKED", "state:LocationAccess.UNAVAILABLE"]
    params:
      access:
        always: {}
        while_in_use: {observe: {text: "Allow location always"}}
        denied: {observe: {text: "Allow location in system settings"}}
        not_asked: {observe: {text: "Allow location"}}
        unavailable: {observe: {text_contains: "Not available on this platform"}}
      presence:
        checking: {observe: {text: "Checking with the relay…"}}
        relay_unreachable: {observe: {text_contains: "push relay on the Frigate box can't be reached"}}
        tracked: {observe: {text_contains: "This phone counts as"}}
        not_tracked: {}
    sources: ["shared/src/commonMain/kotlin/**/AwaySettingsScreen.kt", "shared/src/commonMain/kotlin/**/SettingsScreen.kt"]
  doors:
    title: Doors
    group: shell
    match:
      all: [{text: "Door sensors and their alerts"}]
    covers: ["screen:DoorsScreen", "page:route.DoorsRoute", "state:DoorSignal.WEAK", "state:DoorSignal.FAIR", "state:DoorSignal.GOOD", "state:DoorSignal.STRONG"]
    params:
      state:
        unsupported: {observe: {text_contains: "doesn't know about door sensors"}}
        not_listening: {observe: {text_contains: "can't hear the door sensors"}}
        none: {observe: {text: "No door sensors yet"}}
        doors: {observe: {text: "Last 7 days"}}
      plan:
        no_plan: {}
        floor_plan: {observe: {id: doors_plan}}
    sources: ["shared/src/commonMain/kotlin/**/DoorsScreen.kt", "shared/src/commonMain/kotlin/**/DoorsPairing.kt", "shared/src/commonMain/kotlin/**/DoorsFloorPlan.kt"]
  faces:
    title: Faces
    group: shell
    match:
      all: [{text: "Teach Frigate who's who"}]
    covers: ["screen:FaceLibraryScreen", "page:route.FacesRoute"]
    params:
      people:
        listed: {when: "data == 'household'", observe: {text_contains: "Alice"}}
        none: {when: "data == 'quiet'", observe: {text_contains: "Nobody yet"}}
      queue:
        waiting: {when: "data == 'household'", observe: {text: "Not one of us"}}
        empty: {when: "data == 'quiet'", observe: {text: "No faces waiting"}}
    sources: ["shared/src/commonMain/kotlin/**/FaceLibraryScreen.kt"]
  household_cars:
    title: Household cars
    group: shell
    match:
      all: [{text: "Teach Frigate what it's looking at"}]
    covers: ["screen:ClassifierLabelingScreen", "page:route.ClassifierRoute"]
    params:
      queue:
        waiting: {}
        empty: {observe: {text: "Nothing waiting to be labelled"}}
      training:
        never_trained: {observe: {text: "Never trained"}}
        up_to_date: {observe: {text: "Up to date"}}
      profiles:
        shown: {observe: {text: "What your cars look like"}}
        hidden: {}
    sources: ["shared/src/commonMain/kotlin/**/ClassifierLabelingScreen.kt"]
  server:
    title: Server
    group: shell
    match:
      all: [{text: "What Frigate is and is doing"}]
    covers: ["screen:ServerSettingsScreen", "page:route.ServerRoute"]
    params:
      overview:
        loading: {observe: {text: "Reading server stats…"}}
        loaded: {observe: {text: "Version"}}
        failed: {}
    sources: ["shared/src/commonMain/kotlin/**/ServerSettingsScreen.kt", "shared/src/commonMain/kotlin/**/SettingsScreen.kt"]
  uptime:
    title: Uptime
    group: shell
    match:
      all: [{text: "What was reachable, and when"}]
    covers: ["screen:ServerUptimeScreen", "page:route.UptimeRoute"]
    params:
      state:
        loading: {observe: {text: "Reading the uptime record…"}}
        not_kept: {observe: {text_contains: "doesn't keep an uptime record yet"}}
        failed: {observe: {text_contains: "Couldn't read the uptime record"}}
        content: {observe: {text: "Outages"}}
    sources: ["shared/src/commonMain/kotlin/**/ServerUptimeScreen.kt"]
  # ---- Home's pushed pages ----
  camera_detail:
    # A phone on its side lays this screen out differently (the `window: landscape` scenarios, still pending),
    # so "the same screen after a rotation" is not the right check here yet.
    resilience: {skip: [rotate]}
    title: Camera
    group: shell
    match:
      all: [{id: camera_player_taps}]
    covers: ["screen:CameraDetailScreen", "page:route.CameraDetailRoute", "state:CameraDetailUiState.Found", "state:CameraDetailUiState.Loading", "state:CameraDetailUiState.NotFound", "deeplink:MomentDeepLink"]
    params:
      state:
        found: {observe: {id: camera_player_taps}}
        not_found: {}
      recent:
        loading: {observe: {text: "Looking for recent detections…"}}
        empty: {when: "data == 'quiet'", observe: {text: "No detections on this camera yet."}}
        content: {}
    checks:
      - present: {text: Timeline}
      - present: {text: Recent Activity}
    sources: ["shared/src/commonMain/kotlin/**/CameraDetailScreen.kt", "shared/src/commonMain/kotlin/**/CameraQuickActions.kt"]
  # ---- Overlays (verified on a device) ----
  drawer:
    title: Menu drawer
    group: overlay
    kind: modal
    match:
      all: [{id: shell_drawer}]
    # The six apps open from its cards, and a notification's link opens one of them over the shell as well.
    covers: ["overlay:ShellDrawer.ShellDrawer", "overlay:ShellDrawer.InnerAppOverlay", "app:FINANCE", "app:WEATHER", "app:FITNESS", "app:ATLAS", "app:PACKAGES", "app:CHARGING", "deeplink:FinanceDeepLink", "deeplink:WeatherDeepLink", "deeplink:FitnessDeepLink", "deeplink:PackageDeepLink"]
    params:
      finance_card:
        open: {}
        locked: {observe: {text: "Locked while offline"}}
    sources: ["shared/src/commonMain/kotlin/**/ShellDrawer.kt", "app/src/commonMain/kotlin/**/ShellApps.kt"]
  arrange_menu:
    title: Route badge menu
    group: overlay
    kind: modal
    match:
      all: [{text: "Arrange cameras"}]
    covers: ["modal:FrigateAppShell.TopBarMenu"]
  camera_filter:
    title: Camera filter
    group: overlay
    kind: modal
    match:
      all: [{text: "All cameras"}, {text: Driveway}]
      none: [{id: bottom_nav_home}]
    covers: ["modal:MomentsScreen.FilterMenuChip"]
  event_filter:
    title: Event filter
    group: overlay
    kind: modal
    match:
      all: [{text: People}, {text: Vehicles}]
      none: [{id: bottom_nav_home}]
    covers: ["modal:MomentsScreen.FilterMenuChip"]

  # ================= Declared from the source, not yet tried on a device =================
  # ---- Sign-in (the walks start after it: the scene signs in by script) ----
  sign_in:
    title: Sign in
    group: signin
    # Recognised (a killed process comes back here), though no walk starts on it yet: walks sign in by script.
    match:
      all: [{id: sign_in_connect}]
    covers: ["screen:SecureConnectionScreen", "page:route.SecureConnectionRoute", "state:ConnectUiState.Idle", "state:ConnectUiState.AwaitingBiometrics", "state:ConnectUiState.Connecting", "state:ConnectUiState.Error"]
    params:
      state:
        idle: {}
        connecting: {}
        awaiting_biometrics: {}
        error: {observe: {text: "Couldn't connect to server"}}
      saved_login:
        none: {}
        biometric: {observe: {text_contains: "Sign in with"}}
      tailscale_hint:
        off: {}
        active: {observe: {text: "Tailscale Active"}}
    checks:
      - present: {id: sign_in_server_url}
      - present: {id: sign_in_username}
      - present: {id: sign_in_password}
      - present: {id: sign_in_apps}
    sources: ["shared/src/commonMain/kotlin/**/SecureConnectionScreen.kt", "shared/src/commonMain/kotlin/**/SecureConnectionViewModel.kt"]
  sign_in_biometric_offer:
    title: Offer to save the login for biometrics
    group: overlay
    kind: modal
    pending: "needs a device capability"
    match:
      all: [{text_matches: "(Enable|Update) .* sign-in\\?"}]
    # Shown after a typed sign-in succeeds (ConnectUiState.Success, not via biometrics) on a device with biometrics enrolled.
    covers: ["modal:SecureConnectionScreen.BiometricSaveOfferDialog", "state:ConnectUiState.Success"]
    params:
      offer:
        enable: {observe: {text_contains: "Skip retyping your password"}}
        update: {observe: {text_contains: "instead of the one saved before"}}
    sources: ["shared/src/commonMain/kotlin/**/SecureConnectionScreen.kt"]
  sign_in_drawer:
    title: Menu drawer before signing in
    group: overlay
    kind: modal
    pending: "not yet verified on a device"
    # The drawer over the sign-in screen: the same shell_drawer, but no cameras to hop to, and the apps open without a server.
    sources: ["shared/src/commonMain/kotlin/**/ShellDrawer.kt", "shared/src/commonMain/kotlin/**/SecureConnectionScreen.kt"]

  # ---- Shell: top bar menus, assistant, wide windows ----
  version_menu:
    title: Route badge menu (version only)
    group: overlay
    kind: modal
    pending: "not yet verified on a device"
    match:
      all: [{text_contains: "Version "}]
      none: [{id: bottom_nav_home}]
    sources: ["shared/src/commonMain/kotlin/**/FrigateAppShell.kt"]
  assistant:
    title: Assistant
    group: overlay
    kind: modal
    pending: "not yet verified on a device"
    match:
      any: [{id: assistant_card}, {id: assistant_model}]
    covers: ["overlay:AssistantOverlay.AssistantLayer", "deeplink:ShellCommand.Assistant"]
    params:
      key:
        missing: {observe: {text_contains: "Claude needs your own API key"}}
        saved: {observe: {id: assistant_model}}
    sources: ["shared/src/commonMain/kotlin/**/AssistantOverlay.kt", "shared/src/commonMain/kotlin/**/AssistantTrigger.kt"]
  assistant_model_menu:
    title: Assistant model menu
    group: overlay
    kind: modal
    pending: "not yet verified on a device"
    covers: ["modal:AssistantOverlay.ModelChip"]
    sources: ["shared/src/commonMain/kotlin/**/AssistantOverlay.kt"]
  card_quick_look:
    title: Camera card quick look
    group: overlay
    kind: modal
    pending: "needs a device capability"
    # A pinch on a Home camera card lifts its video into a layer over the shell (no multitouch on apksim).
    covers: ["overlay:CameraCardZoom.CameraCardZoomOverlay"]
    sources: ["shared/src/commonMain/kotlin/**/CameraCardZoom.kt"]
  shell_sidebar:
    title: Shell with a sidebar
    group: wide
    pending: "needs a wide window"
    match:
      all: [{id: shell_sidebar}]
    covers: ["deeplink:ShellCommand.ToggleSidebar"]
    params:
      sidebar:
        shown: {observe: {text: "Hide sidebar"}}
        hidden: {observe: {text: "Show sidebar"}}
    sources: ["shared/src/commonMain/kotlin/**/ShellSidebar.kt", "shared/src/commonMain/kotlin/**/FrigateAppShell.kt"]
  sidebar_app_host:
    title: A drawer app beside the sidebar
    group: wide
    pending: "needs a wide window"
    # One of the six apps shown in the content area of a wide window, listed in the sidebar (sidebar_app_<name>).
    covers: ["deeplink:ShellCommand.Open"]
    params:
      app:
        finance: {}
        weather: {}
        fitness: {}
        atlas: {}
        packages: {}
        charging: {}
    sources: ["app/src/commonMain/kotlin/**/ShellApps.kt", "shared/src/commonMain/kotlin/**/ShellSidebar.kt"]
  settings_two_panes:
    title: Settings in two panes
    group: wide
    pending: "needs a wide window"
    match:
      all: [{text: "Pick a setting, and its page opens here."}]
    covers: ["overlay:SettingsTabNav.SettingsTwoPanes"]
    sources: ["shared/src/commonMain/kotlin/**/SettingsTabNav.kt"]

  # ---- Settings: the folds that open in place ----
  settings_fold_cameras:
    title: Settings, Cameras fold
    group: shell
    pending: "not yet verified on a device"
    covers: ["page:SettingsFold.CAMERAS"]
    params:
      access:
        admin_editable: {when: "role == 'admin'"}
        viewer_read_only: {when: "role == 'viewer'", observe: {text_contains: "Signed in as a viewer"}}
      overview:
        loading: {observe: {text: "Reading camera pipelines…"}}
        loaded: {}
    sources: ["shared/src/commonMain/kotlin/**/SettingsScreen.kt"]
  settings_fold_economy:
    title: Settings, Economy commentary fold
    group: shell
    pending: "not yet verified on a device"
    covers: ["page:SettingsFold.ECONOMY"]
    sources: ["shared/src/commonMain/kotlin/**/SettingsScreen.kt", "shared/src/commonMain/kotlin/**/EconomyToneOptions.kt"]
  settings_fold_finance_drawer:
    title: Settings, Finance in the menu fold
    group: shell
    pending: "not yet verified on a device"
    covers: ["page:SettingsFold.FINANCE_DRAWER"]
    sources: ["shared/src/commonMain/kotlin/**/SettingsScreen.kt", "shared/src/commonMain/kotlin/**/FinanceDrawerOptions.kt"]
  settings_fold_figures:
    title: Settings, Exercise figures fold
    group: shell
    pending: "not yet verified on a device"
    covers: ["page:SettingsFold.FIGURES"]
    sources: ["shared/src/commonMain/kotlin/**/SettingsScreen.kt", "shared/src/commonMain/kotlin/**/FigureStyleOptions.kt"]
  settings_fold_maps:
    title: Settings, Maps fold
    group: shell
    pending: "not yet verified on a device"
    covers: ["page:SettingsFold.MAPS"]
    params:
      provider:
        osm: {}
        google: {observe: {id: settings_maps_key}}
    sources: ["shared/src/commonMain/kotlin/**/SettingsScreen.kt", "shared/src/commonMain/kotlin/**/MapProviderOptions.kt"]
  settings_fold_app_icon:
    title: Settings, App icon fold
    group: shell
    pending: "not yet verified on a device"
    covers: ["page:SettingsFold.APP_ICON"]
    sources: ["shared/src/commonMain/kotlin/**/SettingsScreen.kt", "shared/src/commonMain/kotlin/**/AppIconOptions.kt"]

  # ---- Settings pages: dialogs ----
  quiet_hours_dialog:
    title: Quiet hours time picker
    group: overlay
    kind: modal
    pending: "not yet verified on a device"
    match:
      any: [{text: "Quiet from"}, {text: "Quiet until"}]
    covers: ["modal:AlertRulesSection.QuietHoursRows"]
    params:
      end:
        from: {observe: {text: "Quiet from"}}
        until: {observe: {text: "Quiet until"}}
    sources: ["shared/src/commonMain/kotlin/**/AlertRulesSection.kt"]
  away_remove_device_dialog:
    title: Remove a tracked phone
    group: overlay
    kind: modal
    pending: "needs a relay route"
    match:
      all: [{text_matches: "Remove .*\\?"}, {text: Cancel}]
    covers: ["modal:SettingsScreen.PresenceDeviceList"]
    sources: ["shared/src/commonMain/kotlin/**/SettingsScreen.kt"]
  car_profile_dialog:
    title: Describe a household car
    group: overlay
    kind: modal
    pending: "needs a relay route"
    match:
      all: [{text: "Licence plate"}]
    covers: ["modal:ClassifierLabelingScreen.CarProfileDialog"]
    params:
      profile:
        new: {}
        saved: {observe: {text: Forget}}
    sources: ["shared/src/commonMain/kotlin/**/ClassifierLabelingScreen.kt"]
  car_profile_make_menu:
    title: Car make menu
    group: overlay
    kind: modal
    pending: "needs a relay route"
    match:
      all: [{text: "Any make"}]
      none: [{id: bottom_nav_home}]
    covers: ["modal:ClassifierLabelingScreen.CarProfileDialog#2"]
    sources: ["shared/src/commonMain/kotlin/**/ClassifierLabelingScreen.kt"]
  door_rename_dialog:
    title: Name a door
    group: overlay
    kind: modal
    pending: "needs a relay route"
    match:
      all: [{text: "Name this door"}]
    covers: ["modal:DoorsPairing.DoorRenameDialog"]
    sources: ["shared/src/commonMain/kotlin/**/DoorsPairing.kt"]

  # ---- Home's other pages ----
  home_arranging:
    title: Home, arranging cameras
    group: shell
    pending: "not yet verified on a device"
    match:
      all: [{id: home_arrange_done}]
    params:
      cameras:
        shown: {}
        hidden_badge: {observe: {text: Hidden}}
    sources: ["shared/src/commonMain/kotlin/**/HomeLiveViewScreen.kt", "shared/src/commonMain/kotlin/**/CameraArrangeControls.kt"]
  camera_framing:
    title: Frame a camera's picture
    group: fullscreen
    pending: "not yet verified on a device"
    match:
      all: [{id: camera_frame_done}]
    covers: ["screen:CameraFramingScreen", "page:route.CameraFramingRoute"]
    sources: ["shared/src/commonMain/kotlin/**/CameraFramingScreen.kt"]
  nest_camera:
    title: Nest camera
    group: shell
    pending: "needs fixture data"
    match:
      all: [{text_contains: "Live only. Nest cameras"}]
    covers: ["screen:NestCameraScreen", "page:route.NestCameraRoute"]
    sources: ["shared/src/commonMain/kotlin/**/NestCameraScreen.kt"]
  doors_from_home:
    title: Doors (from Home)
    group: shell
    pending: "needs a relay route"
    # The same DoorsScreen as `doors`, pushed on Home's stack from the glance row, or by a door notification: Back returns to Home.
    covers: ["page:route.DoorsHomeRoute", "deeplink:DoorDeepLink"]
    sources: ["shared/src/commonMain/kotlin/**/DoorsScreen.kt", "shared/src/commonMain/kotlin/**/HomeGlance.kt"]
  cars_home:
    title: Cars map
    group: shell
    pending: "needs a relay route"
    match:
      any: [{id: cars_map}, {text_contains: "No cars yet"}, {text_contains: "know where any car is yet"}]
    covers: ["screen:CarsScreen", "page:route.CarsHomeRoute"]
    params:
      state:
        map: {observe: {id: cars_map}}
        no_cars: {observe: {text_contains: "No cars yet"}}
        no_places: {observe: {text_contains: "know where any car is yet"}}
    sources: ["app/src/commonMain/kotlin/**/CarsScreen.kt", "app/src/commonMain/kotlin/**/ParkingRules.kt"]
  cars_model_page:
    title: A car in 3D
    group: shell
    pending: "needs a device capability"
    match:
      all: [{id: cars_model_page}]
    sources: ["app/src/commonMain/kotlin/**/CarsScreen.kt"]
  parking_map:
    title: Parking map
    group: overlay
    kind: modal
    pending: "needs a notification or deep link"
    match:
      all: [{id: parking_map}]
    covers: ["overlay:ParkingMapOverlay.ParkingMapOverlay", "deeplink:ParkingDeepLink"]
    params:
      when:
        move_now: {}
        move_by: {}
    sources: ["app/src/commonMain/kotlin/**/ParkingMapOverlay.kt", "shared/src/commonMain/kotlin/**/ParkingDeepLink.kt"]

  # ---- Camera screen: menus, the editors it opens ----
  camera_overflow_menu:
    title: Camera overflow menu
    group: overlay
    kind: modal
    pending: "not yet verified on a device"
    match:
      all: [{text: "Detection zones"}, {text: "Tag cars in view"}]
      none: [{id: bottom_nav_home}]
    covers: ["modal:CameraDetailScreen.CameraOverflowMenu"]
    sources: ["shared/src/commonMain/kotlin/**/CameraDetailScreen.kt"]
  camera_quality_menu:
    title: Video quality menu
    group: overlay
    kind: modal
    pending: "not yet verified on a device"
    match:
      all: [{text: "Video quality"}, {text: Auto}]
      none: [{id: bottom_nav_home}]
    covers: ["modal:CameraQuickActions.QualityMenu"]
    sources: ["shared/src/commonMain/kotlin/**/CameraQuickActions.kt"]
  detection_zones:
    title: Detection zones
    group: shell
    pending: "not yet verified on a device"
    match:
      all: [{id: detection_zones_canvas}]
    covers: ["screen:DetectionZonesScreen", "page:route.DetectionZonesRoute"]
    params:
      state:
        loading: {}
        failed: {}
        ready: {observe: {id: detection_zones_canvas}}
      zones:
        none: {observe: {text: "No zones yet. Tap the frame to outline an area like the driveway."}}
        some: {}
    sources: ["shared/src/commonMain/kotlin/**/DetectionZonesScreen.kt", "shared/src/commonMain/kotlin/**/MaskEditorState.kt"]
  detection_zones_leave_dialog:
    title: Save zone changes before leaving?
    group: overlay
    kind: modal
    pending: "not yet verified on a device"
    match:
      all: [{text: "Save your changes?"}]
    covers: ["modal:DetectionZonesScreen.DetectionZonesScreen", "overlay:DetectionZonesScreen.DetectionZonesScreen"]
    params:
      layer:
        zones: {observe: {text_contains: "edited this camera's zones"}}
        ignore_areas: {observe: {text_contains: "edited this camera's ignore areas"}}
    sources: ["shared/src/commonMain/kotlin/**/DetectionZonesScreen.kt"]
  car_tagging:
    title: Tag cars in view
    group: fullscreen
    pending: "not yet verified on a device"
    match:
      all: [{id: car-tagging}]
    covers: ["screen:CarTaggingScreen", "page:route.CarTaggingRoute"]
    params:
      state:
        loading: {}
        failed: {}
        ready: {observe: {text: "Camera frame"}}
      tracking:
        none: {observe: {text: "Frigate isn't tracking any cars here right now."}}
        some: {}
    sources: ["shared/src/commonMain/kotlin/**/CarTaggingScreen.kt"]
  clip_editor:
    title: Clip editor
    group: fullscreen
    pending: "not yet verified on a device"
    match:
      any: [{desc: "Close clip editor"}, {id: clip_playhead}]
    covers: ["screen:ClipEditorScreen", "page:route.ClipEditorRoute"]
    params:
      state:
        finding: {observe: {text: "Finding the recording…"}}
        ready: {observe: {id: clip_playhead}}
        failed: {}
      saving:
        idle: {}
        in_background: {observe: {text_contains: "Saving in the background"}}
    sources: ["shared/src/commonMain/kotlin/**/ClipEditorScreen.kt"]
  tag_car_dialog:
    title: Tag a detection's car
    group: overlay
    kind: modal
    pending: "not yet verified on a device"
    match:
      any: [{text: "Whose car is this?"}, {text: "Car tagged"}]
    # From a Moments card, from the camera screen's recent list, or opened on arrival by a notification's "Tag car" button.
    covers: ["modal:MomentCarTagging.TagCarDialog"]
    params:
      state:
        loading: {observe: {text: "Loading the known cars…"}}
        none_known: {observe: {text_contains: "doesn't know any cars yet"}}
        choosing: {}
        saving: {observe: {text: "Teaching the classifier…"}}
        done: {observe: {text: "Car tagged"}}
    sources: ["shared/src/commonMain/kotlin/**/MomentCarTagging.kt"]
  moments_day_picker:
    title: Moments, pick a day
    group: overlay
    kind: modal
    pending: "not yet verified on a device"
    match:
      all: [{text: Show}, {text: Cancel}]
      none: [{id: bottom_nav_home}]
    covers: ["modal:MomentsScreen.MomentDayPicker"]
    sources: ["shared/src/commonMain/kotlin/**/MomentsScreen.kt"]

edges:
  # ---- Verified on a device ----
  - {id: bottom_nav_home, from: "@shell", except: [home], to: home, do: [{tap: {id: bottom_nav_home}}]}
  - {id: bottom_nav_moments, from: "@shell", except: [moments], to: moments, do: [{tap: {id: bottom_nav_moments}}]}
  - {id: bottom_nav_settings, from: "@shell", except: [settings], to: settings, do: [{tap: {id: bottom_nav_settings}}]}
  - {id: settings.open_notifications, from: settings, to: notifications, do: [{swipe: down}, {swipe: down}, {swipe: down}, {wait_ms: 800}, {tap: {text: Notifications}}]}
  - {id: settings.open_away, from: settings, to: away, do: [{swipe: down}, {swipe: down}, {swipe: down}, {wait_ms: 800}, {tap: {text: Away mode}}]}
  - {id: settings.open_doors, from: settings, to: doors, do: [{swipe: down}, {swipe: down}, {swipe: down}, {wait_ms: 800}, {tap: {text: Doors}}]}
  - {id: settings.open_faces, from: settings, to: faces, do: [{swipe: down}, {swipe: down}, {swipe: down}, {wait_ms: 800}, {tap: {text: Faces}}]}
  - {id: settings.open_household_cars, from: settings, to: household_cars, when: "data == 'household'", do: [{swipe: down}, {swipe: down}, {swipe: down}, {wait_ms: 800}, {tap: {text: Household Cars}}]}
  - {id: settings.open_server, from: settings, to: server, do: [{scroll_to: {text: Server}}, {tap: {text: Server}}]}
  - {id: notifications.back, from: [notifications, away, doors, faces, household_cars, server], to: settings, do: [back]}
