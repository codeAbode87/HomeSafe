  - {id: camera_framing.done, from: camera_framing, to: home_arranging, pending: "not yet verified on a device", do: [{tap: {id: camera_frame_done}}]}
  - {id: camera_framing.back, from: camera_framing, to: home_arranging, pending: "not yet verified on a device", do: [back]}

