  - {id: sidebar.open_weather, from: shell_sidebar, to: sidebar_app_host, pending: "needs a wide window", do: [{tap: {id: sidebar_app_weather}}]}
  - {id: sidebar.open_fitness, from: shell_sidebar, to: sidebar_app_host, pending: "needs a wide window", do: [{tap: {id: sidebar_app_fitness}}]}
  - {id: sidebar.open_atlas, from: shell_sidebar, to: sidebar_app_host, pending: "needs a wide window", do: [{tap: {id: sidebar_app_atlas}}]}
  - {id: sidebar.open_packages, from: shell_sidebar, to: sidebar_app_host, pending: "needs a wide window", do: [{tap: {id: sidebar_app_packages}}]}
  - {id: sidebar.open_charging, from: shell_sidebar, to: sidebar_app_host, pending: "needs a wide window", do: [{tap: {id: sidebar_app_charging}}]}
