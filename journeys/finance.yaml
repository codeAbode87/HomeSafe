# Finance, from the drawer. The fake server has no relay (nothing listens on :8787), so every tab says it could not
# read its data; the screens are the app's real error states.
nodes:
  finance_unavailable:
    title: Finance, Wallet (sheet unreadable)
    group: finance
    match:
      all: [{id: finance_app}, {text: "Couldn't read your sheet"}]
    checks:
      - present: {id: finance_back}
      - present: {id: finance_tab_wallet}
    weight: 2
  finance_budget:
    title: Finance, Budget (unreadable)
    group: finance
    match:
      all: [{id: finance_budget}]
    checks:
      - present: {id: finance_back}
      - present: {text: "Couldn't read the budget"}
  finance_markets:
    title: Finance, Markets
    group: finance
    match:
      all: [{id: "finance_index_^GSPC"}]
    checks:
      - present: {id: finance_index_^DJI}
      - present: {id: finance_back}
  finance_economy:
    title: Finance, Economy
    group: finance
    match:
      all: [{id: finance_app}, {text: "HOW IT ALL CONNECTS"}]
    checks:
      - present: {text: "WHERE THE ECONOMY STANDS"}
      - present: {id: finance_back}
  finance_risk:
    title: Finance, Risk
    group: finance
    match:
      all: [{id: finance_app}, {text: "Recession signals"}]
    checks:
      - present: {text: STRESS}
      - present: {id: finance_back}
  finance_glossary:
    title: Finance, Jargon buster
    group: finance
    match:
      all: [{id: finance_app}, {text: "Jargon buster"}, {text_contains: "Every term in this app"}]
    checks:
      - present: {desc: "Search terms"}
  finance_chart_settings:
    title: Finance, Chart settings
    group: finance
    match:
      all: [{id: chart_settings}]
    checks:
      - present: {id: chart_shader_glow}
      - present: {id: chart_settings_preview}

edges:
  - {id: finance.close, from: finance_unavailable, to: home, do: [back]}
  # The tab bar shows on the five tabs, not on the pushed pages.
  - {id: finance.tab_wallet, from: [finance_budget, finance_markets, finance_economy, finance_risk], to: finance_unavailable, count: once, do: [{tap: {id: finance_tab_wallet}}]}
  - {id: finance.tab_budget, from: [finance_unavailable, finance_markets, finance_economy, finance_risk], to: finance_budget, count: once, do: [{tap: {id: finance_tab_budget}}]}
  - {id: finance.tab_markets, from: [finance_unavailable, finance_budget, finance_economy, finance_risk], to: finance_markets, count: once, do: [{tap: {id: finance_tab_markets}}]}
  - {id: finance.tab_economy, from: [finance_unavailable, finance_budget, finance_markets, finance_risk], to: finance_economy, count: once, do: [{tap: {id: finance_tab_economy}}]}
  - {id: finance.tab_risk, from: [finance_unavailable, finance_budget, finance_markets, finance_economy], to: finance_risk, count: once, do: [{tap: {id: finance_tab_risk}}]}
  - {id: finance_unavailable.retry, from: finance_unavailable, to: "=", do: [{tap: {text: Try again}}]}
  - {id: finance_unavailable.open_glossary, from: finance_unavailable, to: finance_glossary, do: [{tap: {id: finance_glossary}}]}
  - {id: finance_unavailable.open_chart_settings, from: finance_unavailable, to: finance_chart_settings, do: [{tap: {id: finance_chart_settings}}]}
  - {id: finance_glossary.back, from: finance_glossary, to: finance_unavailable, do: [back]}
  - {id: finance_chart_settings.back, from: finance_chart_settings, to: finance_unavailable, do: [back]}
